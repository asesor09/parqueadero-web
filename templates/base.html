<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Parqueadero{% endblock %}</title>
    <!-- Conexión a tus estilos globales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <style>
        /* Estilos específicos para el menú de navegación */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .navbar .logo {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 10px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s;
            background-color: rgba(255,255,255,0.1);
        }
        
        .nav-links a:hover, .nav-links a.activo {
            background-color: #3498db;
        }

        /* Contenedor principal donde se inyectarán las otras vistas */
        .contenido-principal {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación Superior -->
    <nav class="navbar">
        <div class="logo">
            🚗 Airport Parking
        </div>
        <div class="nav-links">
            <a href="{{ url_for('mapa_parqueadero') }}">🗺️ Mapa</a>
            <a href="{{ url_for('registrar_vehiculo') }}">📥 Ingreso</a>
            <a href="{{ url_for('listado_entregas') }}">📤 Entregas Hoy</a>
        </div>
    </nav>

    <!-- Aquí se inyectará el contenido de mapa.html, registro.html, etc. -->
    <main class="contenido-principal">
        {% block content %}
        {% endblock %}
    </main>

    <!-- El motor de notificaciones que estará vigilando en todo momento -->
    <script src="{{ url_for('static', filename='notificaciones.js') }}"></script>
</body>
</html>
